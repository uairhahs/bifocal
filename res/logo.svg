<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bifocal: a wide distance lens over a smaller reading lens, the way the extended layout stacks the external monitor over the laptop -->
  <defs>
    <mask id="gap">
      <rect width="64" height="64" fill="#fff"/>
      <ellipse cx="32" cy="45" rx="18.5" ry="14" fill="#000"/>
    </mask>
  </defs>
  <ellipse cx="32" cy="24" rx="27" ry="18" fill="#c678dd" fill-opacity=".4" mask="url(#gap)"/>
  <ellipse cx="32" cy="45" rx="14.5" ry="10" fill="#c678dd"/>
</svg>
